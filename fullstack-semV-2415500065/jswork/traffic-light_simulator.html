<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Traffic Light Simulator</title>
</head>
<body>
    <h2>Traffic Light Simulator</h2>

    <label>Select Light Color:</label>
    <select id="lightColor">
        <option value="red">Red</option>
        <option value="yellow">Yellow</option>
        <option value="green">Green</option>
    </select>

    <button onclick="checkLight()">Check</button>

    <p id="result"></p>
    <script >
        function checkLight() {
            let lightColor = document.getElementById("lightColor").value;
            let message;

            if (lightColor == "red") {
                message = "Stop";
            }
            else if (lightColor == "yellow") {
                message = "Slow down";
            }
            else if (lightColor == "green") {
                message = "Go";
            }

            document.getElementById("result").innerHTML = message;
        }
    </script>
    
</body>
</html>
