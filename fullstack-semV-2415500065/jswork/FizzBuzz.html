
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>FizzBuzz</title>
</head>
<body>
    <h2>FizzBuzz Program</h2>
    <input type="number" id="num" placeholder="Enter a number">
    <button onclick="checkFizzBuzz()">Print</button>
    <p id="result"></p>
    <script>
        function checkFizzBuzz() {
    let n = Number(document.getElementById("num").value);

    if (n % 3 == 0 && n % 5 == 0) {
        document.getElementById("result").innerHTML = "FizzBuzz";
    }
    else if (n % 3 == 0) {
        document.getElementById("result").innerHTML = "Fizz";
    }
    else if (n % 5 == 0) {
        document.getElementById("result").innerHTML = "Buzz";
    }
    else {
        document.getElementById("result").innerHTML = n;
    }
}
    </script>
</body>
</html>
