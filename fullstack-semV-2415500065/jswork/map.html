<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    <p>
        <span id="countvalue">0</span>
        times clicked............
    </p>
    <button id="btn">Click Me</button>
    <script>
        let arr=[1,2,3,4,5];
        console.log(arr);

        let narr=arr.map((n)=>{return n**2});
        console.log(narr);

        narr=arr.filter(n=>n>3);
        console.log(narr);

        narr=arr.find(n=>n>1);
        console.log(narr);

        narr=arr.reduce((acc, n) => acc + n, 0);
        console.log(narr);

    </script>
</body>
</html>
